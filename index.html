<style>
/* Layout: one phone-width column, app header on top, tab bar fixed at the bottom. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#0E3B43; --muted:#4F6B70; --line:#D5E2E0;
  --brand:#0E7C7B; --brand-ink:#FFFFFF; --brand-soft:#E2F1F0; --amber:#F2A541;

  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1F23; --surface:#11292E; --ink:#E6F2F0; --muted:#9DB8B9; --line:#24444A;
  --brand:#3FBFBC; --brand-ink:#0B1F23; --brand-soft:#15393C;
  --safe:#6FD394; --safe-bg:#12321F; --warn:#F5B95A; --warn-bg:#3A2A0E; --scam:#FF8A7E; --scam-bg:#3D1714; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
#player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--brand);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);width:max-content;max-width:calc(100vw - 32px)}
#player .pl-label{font-weight:700;font-size:.95rem;white-space:nowrap}

#player .pl-pause{background:var(--brand);color:var(--brand-ink)}
#player .pl-stop{background:var(--scam-bg);color:var(--scam)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:9;width:max-content;max-width:90vw}

.app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
header svg{width:40px;height:44px;flex:none}
header h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;line-height:1}
header{flex-wrap:wrap}
.langpick{margin-left:auto}
.langpick select{width:auto;max-width:150px;padding:6px 8px;font-size:.85rem;font-weight:700;border-radius:999px;border:2px solid var(--brand);background:var(--brand-soft);color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.examplenote{background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin:0}
.linkbtn{all:unset;cursor:pointer;color:var(--brand);font-weight:700;text-decoration:underline}
input[type=file]{padding:10px;background:var(--surface)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.thumb img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.thumb figcaption{font-size:.72rem;padding:4px 6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;cursor:pointer}
.sendlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:12px}
.sendlist li{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}

.modal-bg{position:fixed;inset:0;background:rgba(5,20,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}

.modal-h3{font-family:var(--display);font-size:1.25rem}

.msg-row b{display:block}.msg-row span{color:#555;font-size:13px}

.call-num{font-size:26px;font-weight:500}.call-sub{opacity:.75}

.steps2{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}

.stepx{font-size:.9rem;color:var(--muted);margin-top:4px}.stepx ul{margin:4px 0 0;padding-left:1.1em}

.org-card{border:2px solid var(--brand);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}

.status{font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}

h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}

.row{display:flex;gap:10px;flex-wrap:wrap}

input,textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px}

/* Daily report */

.c-scam{background:var(--scam-bg);color:var(--scam)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-safe{background:var(--safe-bg);color:var(--safe)}

.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

const FREE_MAIL=/^(gmail|googlemail|yahoo|ymail|outlook|hotmail|live|aol|icloud|me|proton|protonmail|gmx|mail|zoho)\.(com|net|me|org)$/;
const BAD_TLD=/\.(xyz|top|info|click|live|shop|online|site|icu|ru|cn|buzz|cyou|rest|sbs|cfd|monster|zip|mov)$/;
const SHORT=/^(bit\.ly|tinyurl\.com|t\.co|rb\.gy|is\.gd|cutt\.ly|ow\.ly|shorturl\.at|tiny\.cc|s\.id)$/;
const RISKY_FILE=/\.(html?|shtml|zip|rar|7z|exe|scr|iso|img|js|vbs|bat|cmd|msi|lnk|svg)$/i;

function baseDomain(h){h=(h||"").toLowerCase().replace(/^www\./,"");const p=h.split(".");if(p.length<=2)return h;const two=p.slice(-2).join(".");if(/^(co|com|org|net|gov|ac)\.[a-z]{2}$/.test(two))return p.slice(-3).join(".");return two}
function legitFor(brand,host){host=(host||"").toLowerCase();return BRANDS[brand].some(d=>host===d||host.endsWith("."+d))}
function unleet(s){return s.toLowerCase().replace(/0/g,"o").replace(/1/g,"l").replace(/3/g,"e").replace(/5/g,"s").replace(/rn/g,"m").replace(/vv/g,"w")}
function lookalikeBrand(host){
  const label=unleet(host.replace(/\.[a-z.]+$/,"").replace(/[^a-z0-9.-]/g,"")); const flat=label.replace(/[^a-z]/g,"");
  for(const b of Object.keys(BRANDS)){const key=b.replace(/[^a-z]/g,""); if(key.length<4)continue;
    if(flat.includes(key)&&!legitFor(b,host)) return b;}
  return null;
}
function hostOf(u){try{const x=new URL(u.startsWith("http")?u:"https://"+u);return x.hostname.toLowerCase()}catch(e){return ""}}
const BNAME={paypal:"PayPal",usps:"USPS",ups:"UPS",fedex:"FedEx",irs:"IRS",txtag:"TxTag","e-zpass":"E-ZPass",mcafee:"McAfee",docusign:"DocuSign",pikepass:"PikePass"};
function cap(s){return BNAME[s]||s.replace(/\b\w/g,c=>c.toUpperCase())}

function textSignals(t){
  const reasons=[],types={};let score=0;
  RULES.forEach(r=>{if(r.re.test(t)){score+=r.pts;reasons.push(tr(r.why,r.es));types[r.type]=(types[r.type]||0)+r.pts}});
  const urls=t.match(/\b(?:https?:\/\/|www\.)[^\s)<>"']+|\b[a-z0-9-]+\.(?:xyz|top|info|click|live|shop|online|site|icu|ru|cn|buzz|cyou|sbs|cfd)(?:\/[^\s]*)?/gi)||[];
  return {score,reasons,types,urls};
}
function linkSignals(links,add){
  const seen=new Set();
  links.forEach(l=>{
    const host=l.host||hostOf(l.href); if(!host||seen.has(host))return; seen.add(host);
    const lb=lookalikeBrand(host);
    if(BAD_TLD.test(host)) add(4,tr(`A link goes to "${host}", an unusual web address real companies don't use.`,`Un enlace va a "${host}", una dirección rara que las empresas reales no usan.`),"link");
    else if(SHORT.test(host)) add(3,tr(`A link is shortened ("${host}"), so you can't see where it really goes.`,`Un enlace está acortado ("${host}"), así que no se ve a dónde va.`),"link");
    else if(/^\d+\.\d+\.\d+\.\d+$/.test(host)) add(4,tr("A link is a string of numbers, not a real company website.","Un enlace es una serie de números, no un sitio real."),"link");
    else if(lb) add(5,tr(`A link goes to "${host}". It looks like ${cap(lb)}, but it isn't ${cap(lb)}'s real website.`,`Un enlace va a "${host}". Parece ${cap(lb)}, pero no es su sitio real.`),"link");
    // link text shows one website but actually goes to another
    const shown=(l.text||"").match(/^(?:https?:\/\/)?((?:[a-z0-9-]+\.)+[a-z]{2,})(?:\/|$)/i);
    if(shown&&baseDomain(shown[1])!==baseDomain(host)) add(4,tr(`A link says "${shown[1]}" but really goes to "${host}".`,`Un enlace dice "${shown[1]}" pero en realidad va a "${host}".`),"link");
  });
}

/* Score any message. msg: {text, subject, fromName, fromEmail, replyTo, auth, links, attachments, listUnsub} */
function analyze(msg){
  const text=[msg.subject||"",msg.text||""].join("\n");
  const base=textSignals(text);
  let score=base.score;const reasons=base.reasons.slice();const types=Object.assign({},base.types);
  const add=(p,w,t)=>{score+=p;reasons.push(w);types[t]=(types[t]||0)+p};
  const links=(msg.links||[]).slice();
  base.urls.forEach(u=>links.push({href:u,host:hostOf(u),text:""}));
  linkSignals(links,add);

  let trusted=false;
  if(msg.fromEmail){
    const dom=(msg.fromEmail.split("@")[1]||"").toLowerCase();
    const name=(msg.fromName||"").toLowerCase();
    const auth=(msg.auth||"").toLowerCase();
    for(const b of Object.keys(BRANDS)){
      const re=new RegExp("\\b"+b.replace(/[-]/g,"[- ]?")+"\\b","i");
      if(re.test(name)&&!legitFor(b,dom)){
        add(5,FREE_MAIL.test(dom)?tr(`Says it's from ${cap(b)}, but it was sent from a personal ${dom} address.`,`Dice ser de ${cap(b)}, pero se envió desde una cuenta personal de ${dom}.`):tr(`Says it's from ${cap(b)}, but it was sent from "${dom}", which is not ${cap(b)}.`,`Dice ser de ${cap(b)}, pero se envió desde "${dom}", que no es ${cap(b)}.`),"sender");break;
      }
    }
    if(typeof isDisposable==="function"&&isDisposable(dom)) add(6,tr(`Sent from a temporary (throwaway) email service, ${dom}. Anyone can make one in seconds. Real companies never use these.`,`Enviado desde un servicio de correo temporal, ${dom}. Cualquiera lo crea en segundos. Las empresas reales nunca lo usan.`),"sender");
    const lb=lookalikeBrand(dom); if(lb&&!FREE_MAIL.test(dom)) add(5,tr(`The sender's address "${dom}" looks like ${cap(lb)}, but it's a fake copy.`,`La dirección "${dom}" parece de ${cap(lb)}, pero es una copia falsa.`),"sender");
    if(/dmarc=fail/.test(auth)) add(4,tr("The email failed Gmail's sender check (DMARC). The sender's name may be faked.","El correo no pasó la verificación de remitente de Gmail (DMARC). El nombre puede ser falso."),"sender");
    else if(/spf=(fail|softfail)/.test(auth)&&/dkim=(fail|none)/.test(auth)) add(3,tr("The email failed Gmail's sender checks, so the sender may be faked.","El correo no pasó las verificaciones de Gmail; el remitente puede ser falso."),"sender");
    if(msg.replyTo){const rd=(msg.replyTo.split("@")[1]||"").toLowerCase().replace(/>.*$/,""); if(rd&&baseDomain(rd)!==baseDomain(dom)) add(2,tr(`Replies would go to a different address (${rd}) than the sender.`,`Las respuestas irían a otra dirección (${rd}), no al remitente.`),"sender");}
    const legitBrand=Object.keys(BRANDS).some(b=>legitFor(b,dom));
    if(legitBrand&&/dmarc=pass|dkim=pass/.test(auth)) trusted=true;
    if(trusted) score=Math.max(0,score-5);
    else if(msg.listUnsub&&/dmarc=pass/.test(auth)&&score<8) score=Math.max(0,score-2);
  }
  (msg.attachments||[]).forEach(f=>{if(RISKY_FILE.test(f)) add(4,tr(`Has an attachment "${f}" of a type often used to hide harmful files.`,`Tiene un archivo adjunto "${f}" de un tipo usado para esconder virus.`),"tech")});

  const ranked=Object.entries(types).filter(([k])=>k!=="pressure").sort((a,b)=>b[1]-a[1]);
  let kind=ranked.length?TYPES[ranked[0][0]]:(types.pressure?TYPES.pressure:"");
  if(types.family&&types.payment) kind=TYPES.family;
  if(types.toll) kind=TYPES.toll;
  const level=score>=8?"scam":score>=4?"warn":"safe";
  return {score,reasons:[...new Set(reasons)],kind,level,trusted};
}

/* ================= AI check (Claude) ================= */
const AI_SYSTEM=`You are ScamSense, a scam detector that protects people, especially older adults, from scams in email, text messages, and phone calls.
Judge the message you are given. Consider who really sent it, what it asks the reader to do (click, call, pay, share a code, install software, keep a secret), pressure or threats, payment methods (gift cards, crypto, wire, Zelle), lookalike websites, and whether the story makes sense.
Normal newsletters, receipts and reminders from real companies are SAFE. Do not call something a scam just because it is marketing.
Reply with ONLY a JSON object, no other text:
{"verdict":"safe"|"suspicious"|"scam","scam_type":"short name or empty","confidence":0-100,"explanation":"2 short sentences in plain, friendly language a 75-year-old can follow","red_flags":["up to 4 short items"],"what_to_do":["2-4 short steps"]}
Keep the JSON keys and the verdict word in English, but write scam_type, explanation, red_flags and what_to_do in {LANG}.`;

async function aiCheck(item){
  const c=cfg(); if(!c.apiKey) throw new Error("no-key");
  const parts=[];
  parts.push(`Channel: ${item.channel}`);
  if(item.fromName||item.fromEmail) parts.push(`From: ${item.fromName||""} <${item.fromEmail||""}>`);
  if(item.replyTo) parts.push(`Reply-To: ${item.replyTo}`);
  if(item.auth) parts.push(`Sender checks: ${(item.auth.match(/(spf|dkim|dmarc)=\w+/gi)||[]).join(", ")||"unknown"}`);
  if(item.phone) parts.push(`Caller number: ${item.phone}`);
  if(item.subject) parts.push(`Subject: ${item.subject}`);
  const hosts=[...new Set((item.links||[]).map(l=>l.host).filter(Boolean))].slice(0,12);
  if(hosts.length) parts.push(`Link destinations: ${hosts.join(", ")}`);
  if(item.attachments&&item.attachments.length) parts.push(`Attachments: ${item.attachments.join(", ")}`);
  parts.push(`Warning signs found by on-device checks: ${item.local.reasons.length?item.local.reasons.join(" | "):"none"}`);
  parts.push(`Message text:\n"""\n${(item.text||"").slice(0,3500)}\n"""`);
  const txt=await callClaude(AI_SYSTEM.replace("{LANG}",LANGS[langCode()].ai),parts.join("\n"),700);
  const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error(tr("The AI gave an answer ScamSense couldn't read.","La IA dio una respuesta que ScamSense no pudo leer."));
  const j=JSON.parse(m[0]);
  j.verdict=({safe:"safe",suspicious:"warn",scam:"scam"})[j.verdict]||"warn";
  return j;
}
async function callClaude(system,user,maxTokens){
  const c=cfg(); if(!c.apiKey) throw new Error("no-key");
  const body={model:c.model,max_tokens:maxTokens||700,system,messages:[{role:"user",content:user}]};
  let res,tries=0;
  while(true){
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":c.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
    if((res.status===429||res.status===529||res.status>=500)&&tries<2){tries++;await new Promise(r=>setTimeout(r,2000*tries));continue}
    break;
  }
  if(!res.ok){
    let msg="";try{msg=(await res.json()).error.message}catch(e){}
    if(res.status===401) throw new Error("The AI key wasn't accepted. Check it in Settings.");
    if(res.status===404) throw new Error(`The AI model "${c.model}" wasn't found. Pick another model in Settings.`);
    if(res.status===400&&/credit/i.test(msg)) throw new Error("Your AI account is out of credit. Add credit at console.anthropic.com.");
    throw new Error(`AI check failed (${res.status}). ${msg}`);
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function finalLevel(item){
  if(item.ai){let v=item.ai.verdict; if(item.local.score>=8&&v==="safe") v="warn"; if(item.local.score>=14&&v==="warn") v="scam"; return v}
  return item.local.level;
}

/* ================= Gmail (read-only, runs in this browser) ================= */
let token=null,tokenExp=0;
function getToken(interactive){
  return new Promise((resolve,reject)=>{
    const c=cfg();
    if(!c.clientId) return reject(new Error("Add your Google Client ID in Settings first."));
    if(!/\.apps\.googleusercontent\.com$/.test(c.clientId)) return reject(new Error("That's not a Google Client ID. It's a long code from Google Cloud that ends in .apps.googleusercontent.com, not your email."));
    if(location.protocol==="file:") return reject(new Error("Gmail can't connect when the app is opened from a file. Open it at http://localhost:8000 or your GitHub Pages link."));
    if(!(window.google&&google.accounts&&google.accounts.oauth2)) return reject(new Error("Google sign-in is still loading. Try again in a moment."));
    if(token&&Date.now()<tokenExp-60000) return resolve(token);
    const tc=google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:"https://www.googleapis.com/auth/gmail.readonly",
      callback:(r)=>{if(r.error) return reject(new Error("Google sign-in was cancelled or failed: "+r.error)); token=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;S.set("connected",true);setStatus();resolve(token)},
      error_callback:(e)=>reject(new Error(e&&e.type==="popup_closed"?"The Google window was closed before finishing.":"Google sign-in didn't open. Allow pop-ups for this site and try again."))});
    tc.requestAccessToken({prompt:S.get("connected",false)&&!interactive?"":"consent"});
  });
}
async function gfetch(path){
  const r=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/"+path,{headers:{Authorization:"Bearer "+token}});
  if(r.status===401){token=null;throw new Error("Google sign-in expired. Tap Scan again.")}
  if(!r.ok) throw new Error("Gmail error "+r.status);
  return r.json();
}
function b64(s){const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/"));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(bytes)}
function htmlToParts(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("style,script,head,title").forEach(n=>n.remove());
  const links=[...doc.querySelectorAll("a[href]")].map(a=>({href:a.getAttribute("href"),text:(a.textContent||"").trim().slice(0,140)})).filter(l=>/^https?:/i.test(l.href)).map(l=>Object.assign(l,{host:hostOf(l.href)}));
  doc.querySelectorAll("br,p,div,tr,li").forEach(n=>n.append(" "));
  return {text:(doc.body?doc.body.textContent:"").replace(/\s+/g," ").trim(),links};
}
function parseGmail(m){
  const H={};(m.payload.headers||[]).forEach(h=>{const k=h.name.toLowerCase();H[k]=H[k]?H[k]+" ; "+h.value:h.value});
  const acc={plain:"",html:"",attachments:[]};
  (function walk(p){ if(!p)return; if(p.parts) p.parts.forEach(walk);
    else if(p.filename) acc.attachments.push(p.filename);
    else if(p.body&&p.body.data){ if(p.mimeType==="text/plain") acc.plain+=b64(p.body.data)+"\n"; else if(p.mimeType==="text/html") acc.html+=b64(p.body.data); } })(m.payload);
  let text=acc.plain.trim(),links=[];
  if(acc.html){const h=htmlToParts(acc.html);links=h.links;if(!text)text=h.text}
  const from=H["from"]||""; const fm=from.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  const fromName=fm?fm[1].trim():"", fromEmail=(fm?fm[2]:from).trim().toLowerCase();
  const rt=H["reply-to"]||""; const rtm=rt.match(/<([^>]+)>/);
  const lb=m.labelIds||[];
  const folder=lb.includes("SPAM")?"Spam":lb.includes("TRASH")?"Trash":lb.includes("CATEGORY_PROMOTIONS")?"Promotions":lb.includes("CATEGORY_SOCIAL")?"Social":lb.includes("CATEGORY_UPDATES")?"Updates":lb.includes("CATEGORY_FORUMS")?"Forums":lb.includes("INBOX")?"Inbox":"Archived";
  return {id:m.id,folder,inSpam:folder==="Spam",channel:"email",source:"gmail",fromName,fromEmail,replyTo:rtm?rtm[1]:rt.trim(),subject:H["subject"]||"(no subject)",
    date:Number(m.internalDate)||Date.now(),text:text.replace(/\s+/g," ").slice(0,6000),snippet:m.snippet||"",links,attachments:acc.attachments,
    auth:(H["authentication-results"]||"")+" "+(H["arc-authentication-results"]||""),listUnsub:!!H["list-unsubscribe"]};
}
async function pool(items,n,fn){let i=0;const run=async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}};await Promise.all(Array.from({length:Math.min(n,items.length)},run))}

/* ================= scanning ================= */
let scanning=false;
async function scanGmail(){
  if(scanning)return; scanning=true;
  const c=cfg();
  try{
    renderToday({progress:{label:t("prog_connect"),pct:5}});
    await getToken(false);
    renderToday({progress:{label:t("prog_find"),pct:10}});
    // Every folder: Inbox, Promotions, Social, Updates, Forums, archived, Spam and Trash. Skips only mail you sent and drafts.
    const list=await gfetch(`messages?maxResults=${Math.min(500,c.max)}&includeSpamTrash=true&q=${encodeURIComponent(`newer_than:${c.days}d -in:sent -in:drafts -in:chats`)}`);
    const ids=(list.messages||[]).map(m=>m.id);
    const items=[];let done=0;
    await pool(ids,5,async id=>{const m=await gfetch(`messages/${id}?format=full`);items.push(parseGmail(m));done++;renderToday({progress:{label:t("prog_read",{d:done,n:ids.length}),pct:10+40*done/Math.max(1,ids.length)}})});
    await finishScan(items,"gmail");
  }catch(e){toast(e.message);renderToday()}
  finally{scanning=false}
}
async function finishScan(items,source){
  const c=cfg();await loadDisposable();
  items.forEach(it=>{it.local=analyze(it)});
  const wantsAI=c.apiKey&&c.aiMode!=="off";
  const aiList=wantsAI?items.filter(it=>c.aiMode==="all"||it.local.score>=2||it.local.reasons.length):[];
  let done=0,aiErr=null;
  await pool(aiList,3,async it=>{
    try{it.ai=await aiCheck(it)}catch(e){it.aiError=e.message;aiErr=e.message}
    done++;renderToday({progress:{label:t("prog_ai",{d:done,n:aiList.length}),pct:50+50*done/Math.max(1,aiList.length)}});
  });
  items.forEach(it=>{if(!it.ai&&it._demoAI){it.ai=JSON.parse(JSON.stringify(pickDemoAI(it._demoAI)));it.ai.verdict=({safe:"safe",suspicious:"warn",scam:"scam"})[it.ai.verdict]||it.ai.verdict}});
  items.forEach(it=>{it.level=finalLevel(it)});
  const order={scam:0,warn:1,safe:2};
  items.sort((a,b)=>order[a.level]-order[b.level]||b.date-a.date);
  const report={at:Date.now(),source,days:c.days,ai:!!wantsAI,aiChecked:aiList.length,items};
  S.set("report",Object.assign({},report,{items:report.items.map(slimItem)}));
  const hist=S.get("history",[]);hist.push({at:report.at,checked:items.length,scam:items.filter(i=>i.level==="scam").length,warn:items.filter(i=>i.level==="warn").length});S.set("history",hist.slice(-90));
  if(aiErr) toast(aiErr);
  renderToday();
}

/* Read aloud with Pause / Resume / Stop. Text is read in short pieces so long reports don't cut off. */
const Reader={queue:[],i:0,paused:false,active:false};
function playerBar(){
  let el=document.getElementById("player");
  if(!el){el=document.createElement("div");el.id="player";el.setAttribute("role","region");el.setAttribute("aria-label","Read aloud");
    el.innerHTML='<span class="pl-label" aria-live="polite"></span><button class="pl-pause" type="button"></button><button class="pl-stop" type="button"></button>';
    document.body.appendChild(el);
    el.querySelector(".pl-pause").onclick=togglePause;
    el.querySelector(".pl-stop").onclick=stopSpeaking;}
  return el;
}
function updatePlayer(){
  const el=playerBar();el.hidden=!Reader.active;
  el.querySelector(".pl-pause").textContent=Reader.paused?t("resume"):t("pause");
  el.querySelector(".pl-stop").textContent=t("stop");
  el.querySelector(".pl-label").textContent=Reader.paused?t("paused"):t("reading");
}
function speakNext(){
  if(!Reader.active)return;
  if(Reader.i>=Reader.queue.length){stopSpeaking();return}
  const u=new SpeechSynthesisUtterance(Reader.queue[Reader.i++]);u.rate=.92;u.lang=LANGS[langCode()].speech;
  u.onend=()=>{if(Reader.active&&!Reader.paused)speakNext()};
  u.onerror=()=>{if(Reader.active&&!Reader.paused)speakNext()};
  speechSynthesis.speak(u);
}
function speak(text){
  try{
    if(!("speechSynthesis" in window))throw 0;
    speechSynthesis.cancel();
    Reader.queue=(String(text).replace(/\s+/g," ").match(/[^.!?。！？]+[.!?。！？]*\s*/g)||[text]).map(x=>x.trim()).filter(Boolean);
    Reader.i=0;Reader.paused=false;Reader.active=true;updatePlayer();speakNext();
  }catch(e){toast(t("read_na"))}
}
function togglePause(){
  if(!Reader.active)return;
  if(Reader.paused){Reader.paused=false;Reader.i=Math.max(0,Reader.i-1);speechSynthesis.cancel();updatePlayer();speakNext();}
  else{Reader.paused=true;speechSynthesis.cancel();updatePlayer();}
}
function stopSpeaking(){Reader.active=false;Reader.paused=false;Reader.queue=[];try{speechSynthesis.cancel()}catch(e){}updatePlayer()}

function itemHTML(it,idx){

  const flags=ai&&ai.red_flags&&ai.red_flags.length?[...ai.red_flags,...it.local.reasons.slice(0,2)]:it.local.reasons;
  if(ai&&ai.verdict==="safe"&&it.level!=="safe") h+=`<p class="small" style="margin:0">${t("ai_overruled")}</p>`;
  if(it.level!=="safe"&&flags.length) h+=`<div><p class="label">${t("signs")}</p><ul dir="auto">${[...new Set(flags)].slice(0,6).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;

  h+=`<button class="btn ghost" data-speak>${t("read_aloud")}</button></div>`;
  return h;
}

function homeScreen(){const sc=document.getElementById("screen");if(!sc)return;

function stepsInit(items){const ol=document.getElementById("simsteps");ol.innerHTML=items.map((x,i)=>`<li id="st${i}" class="pending">${x}</li>`).join("")}
function stepOn(i,extra,cls){const li=document.getElementById("st"+i);if(!li)return;li.className=cls||"done";if(extra)li.insertAdjacentHTML("beforeend",`<div class="stepx">${extra}</div>`)}
function simText(k){
  simClear();homeScreen();const m=SIM_TEXTS[k];const r=analyze({text:m.text,links:[],attachments:[],subject:""});

  stepsInit([tr("A text arrives from a number not in your contacts.","Llega un texto de un número que no está en sus contactos."),
    tr("iPhone asks ScamSense: is this junk?","El iPhone le pregunta a ScamSense: ¿es basura?"),
    tr("ScamSense checks it on the phone.","ScamSense lo revisa en el teléfono."),
    tr("If it's not sure, the AI double-checks it through the ScamSense server.","Si no está seguro, la IA lo revisa por el servidor de ScamSense."),
    tr("iPhone puts it in the right place.","El iPhone lo pone en el lugar correcto.")]);

  simAt(300,()=>{stepOn(0,`<span class="mono">${esc(m.from)}</span>`);document.getElementById("notifs").innerHTML=`<div class="notif in"><b>💬 ${esc(m.from)}</b><span>${tr("Checking with ScamSense…","Revisando con ScamSense…")}</span></div>`});
  simAt(1100,()=>stepOn(1));
  simAt(1900,()=>stepOn(2,r.reasons.length?`<ul>${r.reasons.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:tr("No warning signs found.","No se encontraron señales de alerta.")));
  simAt(2700,()=>stepOn(3,lvl==="warn"?tr("AI checked it: suspicious.","La IA lo revisó: sospechoso."):tr("Not needed: the on-device check was sure.","No hizo falta: la revisión en el teléfono estaba segura."),lvl==="warn"?"done":"skip"));
  simAt(3500,()=>{
    const junk=lvl!=="safe";
    stepOn(4,junk?`<b class="red">${tr("Moved to Junk. No sound, no alert.","Movido a Basura. Sin sonido ni alerta.")}</b>`:`<b class="green">${tr("Delivered normally.","Entregado normalmente.")}</b>`);
    sc.className="screen app";
    sc.innerHTML=`<div class="sb"><span>${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span><span>▮▮▮ 5G</span></div>
      <div class="msg-head"><b>${tr("Messages","Mensajes")}</b></div>
      <div class="msg-tabs"><span class="${junk?"":"on"}">${tr("Known","Conocidos")}</span><span>${tr("Unknown","Desconocidos")}</span><span class="${junk?"on":""}">${tr("Junk","Basura")}${junk?" · 1":""}</span></div>
      <div class="msg-row ${junk?"junk":""}"><div class="av">${junk?"!":"✓"}</div><div><b>${esc(m.from)}</b><span>${esc(m.text)}</span>
      ${junk?`<em class="ss-tag">ScamSense: ${esc(cap(r.kind||tr("scam","estafa")))}</em>`:`<em class="ss-tag ok">ScamSense: ${tr("looks safe","parece seguro")}</em>`}</div></div>
      ${junk?`<div class="msg-note">${tr("Links in Junk are turned off. You can still read it.","Los enlaces en Basura están desactivados. Aún puede leerlo.")}</div>`:""}`;
  });
}
function simCall(k){
  simClear();homeScreen();const c=SIM_CALLS[k];const sc=document.getElementById("screen");
  stepsInit([tr("A call is coming in.","Está entrando una llamada."),
    tr("iPhone looks up the number in ScamSense's list on the phone (no call audio is shared).","El iPhone busca el número en la lista de ScamSense en el teléfono (no se comparte el audio).")+"",

    tr("ScamSense adds it to your Daily Safety Report.","ScamSense lo agrega a su Reporte diario.")]);
  simAt(300,()=>stepOn(0,`<span class="mono">${esc(c.num)}</span>`));
  simAt(1100,()=>stepOn(1,c.kind==="contact"?tr("In your contacts. Not checked.","En sus contactos. No se revisa."):tr(`Found: reported ${c.reports} times as a scam. Line type: internet number from a free calling app (auto-generated, not tied to a real person).`,`Encontrado: reportado ${c.reports} veces como estafa. Tipo de línea: número de internet de una app gratuita (generado automáticamente, no pertenece a una persona real).`)));
  simAt(1900,()=>{
    if(c.kind==="block"){stepOn(2,`<b class="red">${tr("Blocked. Your phone didn't ring.","Bloqueada. Su teléfono no sonó.")}</b>`);
      document.getElementById("notifs").innerHTML=`<div class="notif in"><b>🚫 ScamSense</b><span>${tr(`Blocked a call from ${c.num} (known scam number).`,`Bloqueó una llamada de ${c.num} (número de estafa conocido).`)}</span></div>`;return}
    stepOn(2,c.kind==="label"?`<b class="red">${tr("Labeled \"Scam Likely – ScamSense\".","Etiquetada \"Posible estafa – ScamSense\".")}</b>`:`<b class="green">${tr("Rings normally.","Suena normalmente.")}</b>`);
    sc.className="screen call";
    sc.innerHTML=`<div class="sb light"><span>${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span><span>▮▮▮ 5G</span></div>
      <div class="call-top">${c.kind==="label"?`<div class="call-warn">⚠️ ${tr("Scam Likely – ScamSense","Posible estafa – ScamSense")}</div>`:""}<div class="call-num">${esc(c.num)}</div><div class="call-sub">${c.kind==="label"?tr(`Reported ${c.reports} times`,`Reportado ${c.reports} veces`):tr("mobile","móvil")}</div></div>
      <div class="call-btns"><div><span class="cb decline">✕</span><small>${tr("Decline","Rechazar")}</small></div><div><span class="cb accept">✆</span><small>${tr("Accept","Aceptar")}</small></div></div>`;
  });
  simAt(2900,()=>stepOn(3,c.kind==="contact"?tr("Not added: it's a contact.","No se agrega: es un contacto."):tr("\"1 scam call caught today.\"","\"1 llamada de estafa detectada hoy.\""),c.kind==="contact"?"skip":"done"));
}

const opt=(v,key,sel)=>`<option value="${v}" ${sel===v?"selected":""}>${t(key)}</option>`;
let pauseState={who:"",how:"",amt:"",note:""};
function renderPause(){
  const p=pauseState;
  view.innerHTML=`${pageHead(t("p_title"),t("p_sub"),"help")}
  <section class="card">
    <div class="field"><label for="pw">${t("p_who")}</label><select id="pw"><option value=""></option>${["gov","tech","family","online","prize","company","seller","other"].map(k=>opt(k,"who_"+k,p.who)).join("")}</select></div>
    <div class="field"><label for="ph">${t("p_how")}</label><select id="ph"><option value=""></option>${["gift","crypto","wire","p2p","cash","card","check","other"].map(k=>opt(k,"how_"+k,p.how)).join("")}</select></div>
    <div class="field"><label for="pa">${t("p_amt")}</label><input id="pa" inputmode="decimal" placeholder="$500" value="${esc(p.amt)}"></div>

    <button class="btn primary" id="pgo">${t("p_go")}</button></section><section id="presult" aria-live="polite"></section>`;

function assessPayment(p){
  let score=0;const reasons=[];
  const add=(n,k)=>{score+=n;reasons.push(t(k))};
  ({gift:()=>add(10,"r_gift"),crypto:()=>add(9,"r_crypto"),wire:()=>add(6,"r_wire"),p2p:()=>add(4,"r_p2p"),cash:()=>add(9,"r_cash"),check:()=>add(2,"r_check")}[p.how]||(()=>{}))();
  ({gov:()=>add(8,"r_gov"),tech:()=>add(8,"r_tech"),family:()=>add(4,"r_family"),online:()=>add(8,"r_online"),prize:()=>add(8,"r_prize"),company:()=>add(3,"r_company"),seller:()=>add(2,"r_seller")}[p.who]||(()=>{}))();
  if(p.note){const s=textSignals(p.note);score+=s.score;s.reasons.forEach(r=>{if(!reasons.includes(r))reasons.push(r)})}
  const amt=parseFloat(String(p.amt).replace(/[^\d.]/g,""));if(amt>=1000){score+=1;reasons.push(t("r_big"))}
  return {score,reasons,level:score>=8?"scam":score>=4?"warn":"safe"};
}
let stillTimer=null;
async function runPause(){
  pauseState={who:document.getElementById("pw").value,how:document.getElementById("ph").value,amt:document.getElementById("pa").value.trim(),note:document.getElementById("pn").value.trim()};
  const out=document.getElementById("presult");const btn=document.getElementById("pgo");
  const r=assessPayment(pauseState);
  let ai=null;const c=cfg();
  if(c.apiKey&&c.aiMode!=="off"&&(pauseState.note||pauseState.who)){
    btn.disabled=true;btn.textContent=t("checking");
    const story=`Someone is asking me to pay. Who: ${pauseState.who?STR.en["who_"+pauseState.who]:"unknown"}. How: ${pauseState.how?STR.en["how_"+pauseState.how]:"unknown"}. Amount: ${pauseState.amt||"unknown"}. What they said: ${pauseState.note||"(not given)"}`;
    try{ai=await aiCheck({channel:"payment request",text:story,links:[],attachments:[],local:{reasons:r.reasons}})}catch(e){if(e.message!=="no-key")toast(e.message)}
    btn.disabled=false;btn.textContent=t("p_go");
  }
  let level=r.level;if(ai){level=ai.verdict;if(r.score>=8&&level!=="scam")level="scam";}
  const head={scam:["p_stop","p_stop_sub"],warn:["p_wait","p_wait_sub"],safe:["p_ok","p_ok_sub"]}[level];
  const reasons=ai&&ai.red_flags?[...ai.red_flags,...r.reasons]:r.reasons;
  out.innerHTML=`<div class="card pause-card pc-${level}">
    <div class="pause-head"><span class="pause-hand" aria-hidden="true">${level==="safe"?ic("check"):ic("hand")}</span><div><h3>${t(head[0])}</h3><p>${t(head[1])}</p></div></div>
    ${ai&&ai.explanation?`<div class="ai-box"><p class="label">${t("ai_expl")}</p><p dir="auto">${esc(ai.explanation)}</p></div>`:""}
    ${reasons.length?`<div><p class="label">${t("p_why")}</p><ul dir="auto">${[...new Set(reasons)].slice(0,6).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    <div><p class="label">${t("p_before")}</p><ol><li>${t("p_b1")}</li><li>${t("p_b2")}</li><li>${t("p_b3")}</li><li>${t("p_b4")}</li></ol></div>
    ${(()=>{const h=S.get("helpers",[]).find(x=>x.phone);return h&&famPrefs().callBeforePay&&level!=="safe"?`<a class="btn callhelper" href="tel:${esc(h.phone.replace(/[^\d+]/g,""))}">${ic("phone")}<span>${tr(`Call ${h.name} before you pay`,`Llame a ${h.name} antes de pagar`)}</span></a>`:""})()}
    <div class="row"><button class="btn primary" id="pwont">${t("p_wont")}</button><button class="btn ghost" id="ppaid">${t("p_paid")}</button></div>
    <button class="btn ghost" id="pstill" disabled>${t("p_still",{n:10})}</button>
    <p id="pmsg" class="small" style="margin:0" hidden></p>
    <button class="btn ghost" id="pread">${t("read_aloud")}</button></div>`;
  const pmsg=document.getElementById("pmsg");
  document.getElementById("pwont").onclick=()=>{pmsg.hidden=false;pmsg.textContent=t("p_good");const h=S.get("paused",[]);h.push({at:Date.now(),level});S.set("paused",h.slice(-50))};
  document.getElementById("ppaid").onclick=()=>{scamState=Object.assign(scamState,{what:["paid"],method:{gift:"gift",crypto:"crypto",wire:"wire",p2p:"bank",cash:"courier",card:"credit"}[pauseState.how]||"",amt:pauseState.amt,story:pauseState.note});go("scammed")};
  document.getElementById("pread").onclick=()=>speak(`${t(head[0])} ${t(head[1])} ${ai&&ai.explanation?ai.explanation:""} ${reasons.slice(0,4).join(" ")} ${t("p_before")}: ${t("p_b1")} ${t("p_b2")} ${t("p_b3")}`);
  // the "I still want to pay" button unlocks only after a 10-second pause
  clearInterval(stillTimer);let left=10;const still=document.getElementById("pstill");
  stillTimer=setInterval(()=>{left--;if(!document.body.contains(still)){clearInterval(stillTimer);return}
    if(left<=0){clearInterval(stillTimer);still.disabled=false;still.textContent=t("p_still_ready")}else still.textContent=t("p_still",{n:left})},1000);
  still.onclick=()=>{pmsg.hidden=false;pmsg.textContent=t("p_still_msg")};
  out.scrollIntoView({behavior:"smooth",block:"start"});
}

async function addEvidenceFiles(files){
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    try{const url=URL.createObjectURL(f);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
      const sc=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      evidence.push({src:c.toDataURL("image/jpeg",.82),w:c.width,h:c.height,cap:f.name});}catch(e){toast(tr("That picture couldn't be added.","No se pudo agregar esa imagen."))}
  }

}

let DISPOSABLE=null,DISPOSABLE_WILD=null,disposableLoading=null;
function loadDisposable(){
  if(DISPOSABLE)return Promise.resolve();
  if(!disposableLoading) disposableLoading=Promise.all([fetch("vendor/disposable-domains.txt").then(r=>r.text()),fetch("vendor/disposable-wildcard.txt").then(r=>r.text())])
    .then(([a,b])=>{DISPOSABLE=new Set(a.split("\n").map(x=>x.trim()).filter(Boolean));DISPOSABLE_WILD=b.split("\n").map(x=>x.trim()).filter(Boolean)})
    .catch(()=>{DISPOSABLE=new Set();DISPOSABLE_WILD=[]});
  return disposableLoading;
}
function isDisposable(dom){if(!DISPOSABLE||!dom)return false;dom=dom.toLowerCase();if(DISPOSABLE.has(dom))return true;
  const parts=dom.split(".");for(let i=1;i<parts.length-1;i++){if(DISPOSABLE.has(parts.slice(i).join(".")))return true}
  return DISPOSABLE_WILD.some(w=>dom===w||dom.endsWith("."+w))}
async function emailInfo(raw){
  const addr=String(raw||"").trim().toLowerCase().replace(/^.*</,"").replace(/>.*$/,"");
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(addr)) return {level:"warn",title:tr("This isn't a complete email address.","Esta no es una dirección de correo completa."),lines:[]};
  const dom=addr.split("@")[1];await loadDisposable();
  if(isDisposable(dom)) return {level:"scam",title:tr("Temporary (throwaway) email address","Correo temporal (desechable)"),
    lines:[tr(`${dom} is a temporary email service. Anyone can make an address there in seconds, with no name and no account.`,`${dom} es un servicio de correo temporal. Cualquiera crea una dirección ahí en segundos, sin nombre ni cuenta.`),
      tr("Real companies, banks, and government agencies never use these. Treat it as fake.","Las empresas, bancos y agencias reales nunca los usan. Trátelo como falso.")]};
  const lb=lookalikeBrand(dom);
  if(lb) return {level:"scam",title:tr(`Fake ${cap(lb)} address`,`Dirección falsa de ${cap(lb)}`),lines:[tr(`"${dom}" is made to look like ${cap(lb)}, but it isn't ${cap(lb)}'s real address.`,`"${dom}" imita a ${cap(lb)}, pero no es su dirección real.`)]};
  const brand=Object.keys(BRANDS).find(b=>legitFor(b,dom));
  if(brand) return {level:"safe",title:tr(`Real ${cap(brand)} address`,`Dirección real de ${cap(brand)}`),lines:[tr(`${dom} belongs to ${cap(brand)}. The name on an email can still be faked, so check the message too.`,`${dom} pertenece a ${cap(brand)}. El nombre se puede falsificar, así que revise también el mensaje.`)]};
  if(FREE_MAIL.test(dom)) return {level:"info",title:tr("Personal email account","Cuenta de correo personal"),lines:[tr(`${dom} is a free personal email service. That's normal for people you know, but companies, banks, and agencies don't send from these.`,`${dom} es un servicio gratuito de correo personal. Es normal en personas que conoce, pero empresas, bancos y agencias no escriben desde ahí.`)]};
  return {level:"info",title:tr("Company or private address","Dirección de empresa o privada"),lines:[tr(`ScamSense can't confirm who owns ${dom} yet. If it says it's a company you know, check that company's real website address.`,`ScamSense aún no puede confirmar quién es dueño de ${dom}. Si dice ser una empresa conocida, compare con su sitio web real.`)]};
}

    <div class="two"><div class="field"><label for="hp">${tr("Phone","Teléfono")}</label><input id="hp" type="tel" inputmode="tel" autocomplete="tel"></div>
    <div class="field"><label for="he">${tr("Email (optional)","Correo (opcional)")}</label><input id="he" type="email" autocomplete="email"></div></div>
    <div class="row"><button class="btn primary" id="hsave">${tr("Save","Guardar")}</button><button class="btn ghost" id="hcancel">${tr("Cancel","Cancelar")}</button></div></div>`;
  document.getElementById("hn").focus();
  document.getElementById("hcancel").onclick=()=>{f.hidden=true;f.innerHTML=""};
  document.getElementById("hsave").onclick=()=>{const v=id=>document.getElementById(id).value.trim();
    if(!v("hn")){toast(tr("Add a name.","Agregue un nombre."));return}if(!v("hp")&&!v("he")){toast(tr("Add a phone number or email.","Agregue un teléfono o correo."));return}
    const hs=S.get("helpers",[]);hs.push({name:v("hn"),rel:v("hr"),phone:v("hp"),email:v("he")});S.set("helpers",hs);toast(tr("Added.","Agregado."));renderFamily()};
}

/* ================= Settings ================= */
function renderSettings(){
  const c=cfg();const conn=S.get("connected",false);
  view.innerHTML=`${pageHead(t("tab_settings"),"")}
  <section class="sect"><h2 class="sect-h">${tr("Email accounts","Cuentas de correo")}</h2><div class="group">
    <div class="grow"><span class="pv" style="--pv:#D93025">G</span><span class="gl"><b>Gmail</b><span>${conn?tr("Connected","Conectado"):tr("Not connected","Sin conectar")}</span></span>
      ${conn?`<button class="btn sm ghost" id="disc">${t("disconnect")}</button>`:`<button class="btn sm primary" id="conn">${tr("Connect","Conectar")}</button>`}</div>
    <button class="grow linkrow" data-go="checkEmail"><span class="pv" style="--pv:#4F6B70">+</span><span class="gl"><b>${tr("Other email providers","Otros proveedores")}</b><span>Outlook, Yahoo, iCloud, AOL</span></span>${ic("chev","chev")}</button></div></section>
  <section class="sect"><h2 class="sect-h">${tr("Smart AI checks","Revisión con IA")}</h2><div class="group">
    <div class="grow col"><label for="key" class="gl"><b>${t("set_key")}</b><span>${tr("Used only to ask Anthropic's AI about risky messages.","Solo para preguntar a la IA de Anthropic sobre mensajes riesgosos.")}</span></label>
      <div class="lookup"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(c.apiKey)}"><button class="btn sm ghost" id="test">${t("test_key")}</button></div></div>
    <div class="grow"><label for="aim" class="gl"><b>${tr("What the AI checks","Qué revisa la IA")}</b></label><select id="aim" class="inline">
      <option value="risky" ${c.aiMode==="risky"?"selected":""}>${tr("Only risky messages","Solo los riesgosos")}</option><option value="all" ${c.aiMode==="all"?"selected":""}>${tr("Every message","Todos")}</option><option value="off" ${c.aiMode==="off"?"selected":""}>${tr("Off","Apagado")}</option></select></div>
    <div class="grow"><span class="gl"><b>${tr("Remember my key on this device","Recordar mi clave en este dispositivo")}</b><span>${tr("Off is safer: you paste it again after closing the tab.","Apagado es más seguro: la pega de nuevo al cerrar.")}</span></span>${switchHTML("remk",c.rememberKey!==false,"")}</div></div></section>
  <section class="sect"><h2 class="sect-h">${tr("Language","Idioma")}</h2><div class="group">
    <div class="grow"><label for="lang" class="gl"><b>${tr("App language","Idioma de la app")}</b><span>${tr("AI answers and read-aloud use it too.","Las respuestas de IA y la lectura también.")}</span></label><select id="lang" class="inline">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${c.lang===k?"selected":""}>${v.name}</option>`).join("")}</select></div></div></section>
  <section class="sect"><h2 class="sect-h">${tr("Daily scan","Revisión diaria")}</h2><div class="group">
    <div class="grow"><label for="days" class="gl"><b>${t("set_days")}</b></label><select id="days" class="inline">${[1,3,7].map(d=>`<option value="${d}" ${c.days===d?"selected":""}>${d===1?t("d24"):t("ddays",{n:d})}</option>`).join("")}</select></div>
    <div class="grow"><label for="max" class="gl"><b>${t("set_max")}</b></label><select id="max" class="inline">${[50,100,200].map(d=>`<option value="${d}" ${c.max===d?"selected":""}>${d}</option>`).join("")}</select></div></div>
    <p class="footnote">${t("set_folders")}</p></section>
  <section class="sect"><h2 class="sect-h">${t("set_priv")}</h2><div class="group">
    <div class="grow col"><span class="gl"><span>${t("priv1")}</span></span></div>
    <div class="grow col"><span class="gl"><span>${t("priv2")}</span></span></div>
    <div class="grow"><a class="gl" href="https://myaccount.google.com/permissions" target="_blank" rel="noopener"><b>${tr("Remove Gmail access in Google","Quitar el acceso de Gmail en Google")}</b><span>myaccount.google.com/permissions</span></a>${ic("chev","chev")}</div>
    <button class="grow linkrow danger" id="wipe"><span class="gl"><b>${t("wipe")}</b></span>${ic("trash")}</button></div></section>
  <section class="sect"><h2 class="sect-h">${t("set_home")}</h2><div class="group"><div class="grow col"><ol class="steps"><li>${t("home1")}</li><li>${t("home2")}</li><li>${t("home3")}</li></ol></div></div></section>
  <details class="sect adv"><summary class="sect-h">${tr("Advanced","Avanzado")}</summary><div class="group">
    <div class="grow col"><label for="cid" class="gl"><b>${t("set_cid")}</b></label><input id="cid" autocomplete="off" spellcheck="false" value="${esc(c.clientId)}"></div>
    <div class="grow col"><label for="mdl" class="gl"><b>${t("set_model")}</b></label><input id="mdl" autocomplete="off" spellcheck="false" value="${esc(c.model)}"></div></div></details>
  <p class="footnote center">${t("footer")}</p>`;
  const save=()=>{saveCfg(Object.assign(cfg(),{lang:document.getElementById("lang").value,rememberKey:document.getElementById("remk").checked,clientId:document.getElementById("cid").value.trim()||DEFAULT_CLIENT_ID,apiKey:document.getElementById("key").value.trim(),aiMode:document.getElementById("aim").value,model:document.getElementById("mdl").value.trim()||"claude-haiku-5-5",days:+document.getElementById("days").value,max:+document.getElementById("max").value}));setStatus()};
  view.querySelectorAll("input,select").forEach(x=>x.onchange=save);
  document.getElementById("lang").onchange=()=>{save();applyLang();renderSettings()};
  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const cn=document.getElementById("conn");if(cn)cn.onclick=async()=>{save();try{await getToken(true);toast(t("gmail_ok"));go("today");scanGmail()}catch(e){toast(e.message)}};
  const dc=document.getElementById("disc");if(dc)dc.onclick=()=>{try{if(token)google.accounts.oauth2.revoke(token,()=>{})}catch(e){}token=null;S.set("connected",false);S.del("report");setStatus();renderSettings();toast(t("gmail_off"))};
  document.getElementById("test").onclick=async()=>{save();const b=document.getElementById("test");b.disabled=true;b.textContent=t("testing");
    try{const r=await aiCheck({channel:"text message",text:"Hi, this is a reminder that your dentist appointment is tomorrow at 10 AM.",links:[],local:{reasons:[]}});toast(t("ai_works",{v:t(r.verdict)}))}catch(e){toast(e.message==="no-key"?t("paste_key"):e.message)}
    b.disabled=false;b.textContent=t("test_key")};
  document.getElementById("wipe").onclick=function(){if(this.dataset.sure){try{Object.keys(localStorage).filter(k=>k.startsWith("ss_")).forEach(k=>localStorage.removeItem(k));Object.keys(sessionStorage).filter(k=>k.startsWith("ss_")).forEach(k=>sessionStorage.removeItem(k))}catch(e){}token=null;setStatus();applyLang();toast(t("wiped"));go("today")}else{this.dataset.sure="1";this.querySelector("b").textContent=t("wipe_sure")}};
}

/* ----- navigation ----- */
const TAB_OF={today:"today",check:"check",checkEmail:"check",checkText:"check",checkCall:"check",preview:"check",help:"help",pause:"help",scammed:"help",family:"family",settings:"settings"};
function fillLangTop(){const el=document.getElementById("langtop");if(!el)return;
  el.innerHTML=Object.keys(LANGS).map(k=>`<option value="${k}" ${langCode()===k?"selected":""}>${LANGS[k].name}</option>`).join("");
  el.onchange=()=>{saveCfg(Object.assign(cfg(),{lang:el.value}));applyLang();const h=location.hash.slice(1);go(TAB_OF[h]?h:"today")}}
function applyLang(){
  fillLangTop();
  document.documentElement.lang=uiLang()==="es"?"es":"en";
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.querySelector("span").textContent=t("tab_"+b.dataset.tab));
  setStatus();if(Reader.active)updatePlayer();
}
function go(tab){
  if(Reader.active)stopSpeaking();
  clearInterval(stillTimer);if(typeof simClear==="function")simClear();
  const top=TAB_OF[tab]||"today";
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===top)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ({today:renderToday,check:renderCheck,checkEmail:renderCheckEmail,checkText:renderCheckText,checkCall:renderCheckCall,preview:renderPreview,help:renderHelp,pause:renderPause,scammed:renderScammed,family:renderFamily,settings:renderSettings}[tab]||renderToday)();
  window.scrollTo(0,0);
  try{history.replaceState(null,"","#"+tab)}catch(e){}
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
applyLang();
go(TAB_OF[location.hash.slice(1)]?location.hash.slice(1):"today");

</script>
</body>
